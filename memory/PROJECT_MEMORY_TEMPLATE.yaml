raw_materials:
  # 原文必须完整保存，不用 Agent 总结替代。
  - id: "RAW-20260825-001"
    date: "2026-08-25"
    source_type: "founder_statement"
    source: "work-orders/runs/WO-20260825-002/00_RAW_REQUEST.md"
    verbatim: "建立第一张真实试运行工单"
    permission_or_access_note: "用于创始人明确要求建立的公开GitHub项目；不包含私人材料"

  - id: "RAW-20260825-002"
    date: "2026-08-25"
    source_type: "founder_statement"
    source: "Codex对话中的项目起始愿景；公开摘录见WO-20260825-002的00账本"
    verbatim: "一个面向2046年的跨学科空间设计与文化战略 Agent。一座虚拟人类成长实验场。它从‘空间希望让人发生什么改变’出发，融合城市建筑、生活方式设计、文化品牌、教育、艺术、哲学与人的成长体验，最终目标不是生产一座形式新颖的建筑，而是创造一个能让人自然发生改变的文化教育场域。"
    permission_or_access_note: "核心段落逐字摘录；完整起始消息尚未作为独立原始文件导出，不能用后续摘要替代"

  - id: "RAW-20260825-003"
    date: "2026-08-25"
    source_type: "founder_statement"
    source: "work-orders/runs/WO-20260825-002/00_RAW_REQUEST.md"
    verbatim: "当一个人在真实世界中接触艺术、自然、建筑、哲学、宗教、人与人的深度交流时，会产生一种AI无法替代的生命状态。仿佛是一种被唤醒的感觉，就像哲学家提到的知识即回忆一样。感受意义并生成意义成为人类的稀缺性。生命主体性的意义生成能力不会外包给AI，例如：感知力、默会知识（身体长期参与世界后形成的判断）、判断同质化的能力。也就是思辨能力、心魂震颤的能力。我认为人类正在进入认知外包过渡期，依靠搜素、AI给定的知识、算法推荐下的短视频、自动生成内容生成自己的认识论。这些工具让使用中变成塑造我思考的环境。我希望能改变人的存在方式，进入到一个场域，放下刚刚说到的那些工具，重新建立人和人的深度链接，并形成聚场效应。大家共同沉浸在保持生命主体性下的宁静和觉知。所以我认为，觉知会是最重要最重要的能力。"
    permission_or_access_note: "G0-Q1创始人回答；逐字保存，包括原始用字"

  - id: "RAW-20260825-004"
    date: "2026-08-25"
    source_type: "founder_statement"
    source: "work-orders/runs/WO-20260825-002/00_RAW_REQUEST.md"
    verbatim: "我希望是90后、00后的孩子。他现在正在外界生活被人工智能的各种新技术冲击刷新认知。同时在这个时代难以安定自己的心，希望寻求精神平静。且有深度思考和愿意与智者对话的年轻人。愿意一周时间投入在这里。对于不用工作的人来说 可以长期在这里。"
    permission_or_access_note: "G0-Q2创始人回答；逐字保存，包括原始空格"

  - id: "RAW-20260825-005"
    date: "2026-08-25"
    source_type: "founder_statement"
    source: "work-orders/runs/WO-20260825-002/00_RAW_REQUEST.md"
    verbatim: "也面向义务教育阶段的孩子。12-60岁。"
    permission_or_access_note: "G0-Q2补充回答；逐字保存"

  - id: "RAW-20260825-006"
    date: "2026-08-25"
    source_type: "founder_statement"
    source: "work-orders/runs/WO-20260825-002/00_RAW_REQUEST.md"
    verbatim: "第一阶段我要25-40岁"
    permission_or_access_note: "G0-Q2第一阶段优先级确认；逐字保存"

  - id: "RAW-20260825-007"
    date: "2026-08-25"
    source_type: "founder_statement"
    source: "work-orders/runs/WO-20260825-002/00_RAW_REQUEST.md"
    verbatim: "即使让项目更慢、更贵、更难传播或降低商业回报，也绝不牺牲：1. 真实体验优与内容消费 2. 深度关系链接优与规模效率 3. 生命主体性下的独立思考提问能力内在判断对生命意义的探索4. 不被催促的时间，不为了快速传播快速变现牺牲沉浸练习慢慢成熟内在变化。本项目明确不负责：1. 不允许任何未经透明审查、以控制意识、操纵关系或获取不当影响力为目的的组织进入。2. 拒绝暴力操控权利压迫情绪PUA羞辱 3. 拒绝持续破坏他人成长环境、拒绝基本规则、消耗共同信任的人进入。"
    permission_or_access_note: "G0-Q3创始人回答；逐字保留用字与编号相连形式"

  - id: "RAW-20260825-008"
    date: "2026-08-25"
    source_type: "founder_statement"
    source: "work-orders/runs/WO-20260825-002/00_RAW_REQUEST.md"
    verbatim: "这两点很好：项目不承担医疗治疗、心理矫正、执法或司法裁决责任；1. 不承诺一次体验或一周驻留必然改变一个人。"
    permission_or_access_note: "G0-Q3责任边界补充确认；逐字保存，不等于G0整体通过"

  - id: "RAW-20260825-009"
    date: "2026-08-25"
