glossary:
  - term: "觉知"
    working_definition: "对身体、情绪、思想、关系与环境保持清醒感受，同时保留自主判断与意义生成能力。"
    exclusions: "不等于放松、情绪愉悦、神秘体验或拒绝一切技术。"
    observable_signs: "能够注意自身与环境变化，暂停自动反应，表达亲身感受，辨别外部建议，并作出有理由的自主选择。"
    status: "draft"

  - term: "生命主体性"
    working_definition: "人不把意义、判断和存在方向完全交给外部系统决定，并能以亲身经验参与世界。"
    exclusions: "不等于孤立的个人主义，也不意味着排斥共同体或工具。"
    observable_signs: "待G1建立人的改变模型后定义。"
    status: "draft"

  - term: "默会知识"
    working_definition: "身体在长期实践和真实情境中形成、难以完全用语言或规则表达的判断。"
    exclusions: "不把直觉自动视为正确，也不以神秘化语言免除验证。"
    observable_signs: "能在具体实践中辨别细微差异、调整动作并说明经验来源。"
    status: "draft"

  - term: "聚场效应"
    working_definition: "多人在共同注意、规则、实践与空间中相互影响，形成超出个体独处的体验强度。"
    exclusions: "不等于从众、情绪感染、权威暗示或人数聚集本身。"
    observable_signs: "待原型验证定义。"
    status: "draft"

  - term: "心魂震颤"
    working_definition: "艺术、自然、思想、宗教经验或深度关系触发的强烈生命感受。"
    exclusions: "不直接等于成长成果，也不作为医学或疗愈效果宣称。"
    observable_signs: "只能由参与者自主描述，并结合后续行动与长期变化谨慎观察。"
    status: "draft"

  - term: "精神平静"
    working_definition: "人在持续刺激与认知冲击中恢复注意、内在秩序和不急于反应的状态。"
    exclusions: "不等于压抑冲突、永久平静、医学疗效或服从权威。"
    observable_signs: "待人的改变模型与原型验证定义。"
    status: "draft"

  - term: "智者"
    working_definition: "具有长期实践、成熟判断并愿意与参与者平等对话的人。"
    exclusions: "不因名望、年龄、流量或自我宣称自动获得权威。"
    observable_signs: "选择、问责和权力边界待教育与伦理制度定义。"
    status: "draft"

  - term: "真实体验"
    working_definition: "人通过身体、材料、空间、自然、关系和时间亲自参与世界，而非只接收关于世界的内容。"
    exclusions: "不把强烈感受自动视为真实，也不排斥必要的知识内容。"
    observable_signs: "参与者实际行动、制作、感受、对话并承担过程结果；待原型验证细化。"
    status: "draft"

  - term: "深度关系连接"
    working_definition: "在持续时间、相互责任、平等对话、边界尊重和自由退出中形成的关系。"
    exclusions: "不等于亲密强迫、情绪依附、权威服从或封闭小团体。"
    observable_signs: "待关系机制与伦理规则定义。"
    status: "draft"

  - term: "不被催促的时间"
    working_definition: "活动节奏服从练习、理解、关系和内在变化成熟所需时间，而非传播或变现速度。"
    exclusions: "不等于无限拖延、缺少计划、拒绝验收或免于复盘。"
    observable_signs: "课程与驻留允许重复练习、空白时间和延迟表达，同时保留阶段检查。"
    status: "draft"

  - term: "透明审查"
    working_definition: "准入与处置规则、证据、责任者、判断过程和申诉路径可以被相关方理解与检查。"
    exclusions: "不以内部决定、个人好恶、身份标签或道德指控代替程序。"
    observable_signs: "规则公开、理由记录、利益冲突披露、比例适当的处置和申诉记录。"
    status: "draft"

  - term: ""
    working_definition: ""
    exclusions: ""
    observable_signs: ""
    status: "draft | founder_confirmed"

